<!-- Auth Modal -->
<div #modalOverlay class="fixed inset-0 bg-black bg-opacity-50 hidden" style="display: none;"></div>
<div id="rbAuth" #modal class="fixed inset-0 flex items-center justify-center p-4 hidden" tabindex="-1" aria-hidden="true">
    <div class="max-w-lg w-full">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="px-4 py-3 border-b">
                <h5 class="font-bold text-red-600">Welcome back</h5>
                <button type="button" class="absolute top-3 right-3 text-gray-500" (click)="openModal('close')">×</button>
            </div>
            <div class="p-4">
                @if (isLoggedIn) {
                <form class="fade-in-up">
                    <div class="mb-3">
                        <label class="form-label" for="">Email address</label>
                        <div class="input-icon"><i class="bi bi-envelope"></i>
                            <input type="email" class="border rounded px-2 py-1 w-full" autocomplete="off" placeholder="you@example.com">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="">Password</label>
                        <div class="input-icon">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="border rounded px-2 py-1 w-full" autocomplete="off" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="button" class="w-full bg-red-600 text-white py-2 rounded-md login">Login</button>
                    <p class="text-center mt-3 mb-0 text-gray-500">New here?
                        <a class="underline cursor-pointer" role="button" (click)="isLoggedIn=false">Create an account</a>
                    </p>
                </form>
                } @else {
                <form class="fade-in-up" [formGroup]="register" (ngSubmit)="onRegister()">
                    <div class="mb-3">
                        <label class="form-label" for="">Email address</label>
                        <div class="input-icon">
                            <i class="bi bi-envelope"></i>
                            <input type="email" class="border rounded px-2 py-1 w-full" formControlName="emailId" autocomplete="off" placeholder="you@example.com">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="">User name</label>
                        <div class="input-icon">
                            <i class="bi bi-person"></i>
                            <input type="text" class="border rounded px-2 py-1 w-full" formControlName="fullName" autocomplete="off" placeholder="username">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="">Password</label>
                        <div class="input-icon">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="border rounded px-2 py-1 w-full" formControlName="password" autocomplete="off" placeholder="••••••••">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="">Password</label>
                        <div class="input-icon">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="border rounded px-2 py-1 w-full" formControlName="confirmPassword" autocomplete="off" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-md register">Register</button>
                    <p class="text-center mt-3 mb-0 text-gray-500">Already have an account?
                        <a class="underline cursor-pointer" role="button" (click)="isLoggedIn=true">Login</a>
                    </p>
                </form>
                }
            </div>
            <div class="px-4 py-3 border-t text-right">
                <button type="button" class="px-4 py-2 rounded-md border" (click)="openModal('close')">Close</button>
            </div>
        </div>
    </div>
</div>
